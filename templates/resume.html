<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume Analyzer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 2em auto;
      max-width: 800px;
      padding: 1em;
      background-color: #f9f9f9;
    }
    h1 {
      color: #333;
    }
    .result, .error {
      padding: 1em;
      margin-top: 1em;
      border-radius: 8px;
    }
    .result {
      background-color: #e6ffe6;
      border: 1px solid #b3ffb3;
    }
    .error {
      background-color: #ffe6e6;
      border: 1px solid #ff9999;
    }
    textarea {
      width: 100%;
      height: 200px;
      margin-top: 1em;
    }
  </style>
</head>
<body>
  <h1>Resume Analyzer</h1>

  <form id="upload-form" enctype="multipart/form-data">
    <label for="resume">Upload your resume (PDF or TXT):</label><br><br>
    <input type="file" name="resume" accept=".pdf, .txt" required>
    <button type="submit">Analyze</button>
  </form>

  <div id="error" class="error" style="display: none;"></div>
  <div id="result" class="result" style="display: none;">
    <strong>Predicted Role:</strong> <span id="prediction"></span>
    <h3>Extracted Resume Text:</h3>
    <textarea readonly id="resume-text"></textarea>
  </div>

  <script>
    const form = document.getElementById('upload-form');
    const resultBox = document.getElementById('result');
    const errorBox = document.getElementById('error');
    const predictionEl = document.getElementById('prediction');
    const resumeTextEl = document.getElementById('resume-text');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(form);

      try {
        const response = await fetch('/pred', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.success) {
          predictionEl.textContent = data.job;
          resumeTextEl.value = data.text;

          errorBox.style.display = 'none';
          resultBox.style.display = 'block';
        } else {
          errorBox.textContent = 'Error analyzing resume.';
          errorBox.style.display = 'block';
          resultBox.style.display = 'none';
        }
      } catch (err) {
        errorBox.textContent = 'Failed to upload resume.';
        errorBox.style.display = 'block';
        resultBox.style.display = 'none';
      }
    });
  </script>
</body>
</html>
